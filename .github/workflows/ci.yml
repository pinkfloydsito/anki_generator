name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test Ruby ${{ matrix.ruby-version }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby-version: ['3.0', '3.1', '3.2', '3.3']
        include:
          # Test on macOS with latest Ruby
          - os: macos-latest
            ruby-version: '3.2'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake test

    - name: Run linting (allow failure)
      run: bundle exec rake lint || true

  build:
    name: Build and verify gem
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Build gem
      run: bundle exec rake build

    - name: Verify gem contents
      run: |
        gem install anki_generator-*.gem --local
        anki_generator help
        anki_generator help generate_yaml

    - name: Upload gem artifact
      uses: actions/upload-artifact@v4
      with:
        name: anki_generator-gem
        path: "*.gem"
        retention-days: 7

  # Separate job for self-hosted runners if needed
  test-self-hosted:
    name: Test on self-hosted runner
    runs-on: self-hosted
    if: false  # Set to true if you want to enable self-hosted testing
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Ruby (if not available)
      run: |
        if ! command -v ruby &> /dev/null; then
          echo "Ruby not found, installing..."
          # Install rbenv if not present
          if ! command -v rbenv &> /dev/null; then
            curl -fsSL https://github.com/rbenv/rbenv-installer/raw/HEAD/bin/rbenv-installer | bash
            echo 'export PATH="$HOME/.rbenv/bin:$PATH"' >> $GITHUB_ENV
            echo 'eval "$(rbenv init -)"' >> $GITHUB_ENV
          fi
          
          # Install Ruby 3.2.0
          rbenv install 3.2.0
          rbenv global 3.2.0
        fi

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install

    - name: Run tests
      run: bundle exec rake test

    - name: Build gem
      run: bundle exec rake build